<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16121f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trash Panda" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="gen/icon_192.png" />
    <link rel="icon" type="image/png" href="gen/icon_192.png" />
    <meta name="description" content="Trash Panda: Right of Way - a raccoon on a bicycle making Toronto a better place to live." />
    <title>Trash Panda: Right of Way</title>
    <!-- M4.14: the link preview in chats and socials (public/og.png, made by tools/og.mjs from the title poster) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trash Panda: Right of Way" />
    <meta property="og:title" content="Trash Panda: Right of Way" />
    <meta property="og:description" content="A raccoon on a bicycle making Toronto a better place to live. Free, in your browser." />
    <meta property="og:url" content="https://besit.github.io/trashpanda/" />
    <meta property="og:image" content="https://besit.github.io/trashpanda/og.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="864" />
    <meta property="og:image:alt" content="Trash Panda, the raccoon, in a bicycle wheel over the Toronto skyline: Trash Panda, Right of Way" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trash Panda: Right of Way" />
    <meta name="twitter:description" content="A raccoon on a bicycle making Toronto a better place to live. Free, in your browser." />
    <meta name="twitter:image" content="https://besit.github.io/trashpanda/og.png" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #16121f; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      #rotate { display: none; position: fixed; inset: 0; background: rgba(22, 18, 31, 0.78); -webkit-backdrop-filter: blur(2px) saturate(0.6); backdrop-filter: blur(2px) saturate(0.6); color: #f6f2e9; font: bold 16px monospace; align-items: center; justify-content: center; text-align: center; flex-direction: column; gap: 12px; z-index: 10; text-shadow: 0 2px 0 #16121f; }
      #rotate .phone { width: 36px; height: 60px; border: 3px solid #f6f2e9; border-radius: 6px; animation: rot 1.6s ease-in-out infinite; }
      @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div>ROTATE YOUR DEVICE</div><div style="font-size:11px;opacity:.75">THE CITY LOOKS BETTER SIDEWAYS</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
